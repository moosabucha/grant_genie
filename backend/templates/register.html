{% extends 'base.html' %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <a class="auth-back" href="{{ url_for('auth.index') }}">&#8592; Back to home</a>
    <div class="auth-tag">Create Account</div>
    <h2 class="auth-title">Get started</h2>
    <p class="auth-sub">Grant Genie is built for researchers. Create your account to begin matching.</p>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label class="form-label" for="name">Full name</label>
        <input class="form-input" type="text" id="name" name="name"
          placeholder="Dr. / Mr. / Ms. Your Name" required/>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" type="email" id="email" name="email"
          placeholder="you@university.ac.uk" required/>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" name="password"
          placeholder="Minimum 8 characters" required/>
      </div>

      <button type="submit" class="form-btn">Create account</button>

      <div class="auth-switch">
        Already registered? <a href="{{ url_for('auth.login') }}">Sign in here</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
