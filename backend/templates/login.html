{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <a class="auth-back" href="{{ url_for('auth.index') }}">&#8592; Back to home</a>
    <div class="auth-tag">Researcher Login</div>
    <h2 class="auth-title">Welcome back</h2>
    <p class="auth-sub">Sign in to access your matched grants and saved results.</p>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" type="email" id="email" name="email"
          placeholder="you@university.ac.uk" required/>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" name="password"
          placeholder="Your password" required/>
      </div>

      <button type="submit" class="form-btn">Sign in</button>

      <div class="auth-switch">
        No account? <a href="{{ url_for('auth.register') }}">Create one here</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
