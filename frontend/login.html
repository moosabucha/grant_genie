<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grant Genie — Login</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
 
<!-- NAVBAR -->
<nav class="navbar">
  <a class="navbar-brand" href="index.html">Grant<span>Genie</span></a>
  <div class="nav-right">
    <a class="nav-link" href="index.html">Home</a>
    <a class="btn-nav" href="register.html">Create account</a>
  </div>
  <button class="hamburger" id="hamburger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>
 
<!-- MOBILE MENU -->
<div class="mobile-menu" id="mobile-menu">
  <a class="mobile-link" href="index.html">Home</a>
  <a class="mobile-cta" href="register.html">Create account</a>
</div>
 
<!-- LOGIN FORM -->
<div class="auth-page">
  <div class="auth-card">
    <a class="auth-back" href="index.html">&#8592; Back to home</a>
    <div class="auth-tag">Researcher Login</div>
    <h2 class="auth-title">Welcome back</h2>
    <p class="auth-sub">Sign in to access your matched grants and saved results.</p>
 
    <div id="alert-container"></div>
 
    <div class="form-group">
      <label class="form-label" for="email">Email address</label>
      <input class="form-input" type="email" id="email" placeholder="you@university.ac.uk" autocomplete="email" required/>
    </div>
 
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input class="form-input" type="password" id="password" placeholder="Your password" autocomplete="current-password" required/>
    </div>
 
    <button class="form-btn" id="login-btn" onclick="handleLogin()">Sign in</button>
 
    <div class="auth-switch">
      No account? <a href="register.html">Create one here</a>
    </div>
  </div>
</div>
 
<!-- TOAST -->
<div class="toast" id="toast">
  <div class="toast-dot"></div>
  <span id="toast-msg"></span>
</div>
 
<script src="js/main.js"></script>
<script>
function handleLogin() {
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  var btn = document.getElementById('login-btn');
 
  if (!email || !password) {
    showToast('Please fill in all fields');
    return;
  }
 
  if (!email.includes('@')) {
    showToast('Please enter a valid email address');
    return;
  }
 
  btn.textContent = 'Signing in...';
  btn.disabled = true;
 
  var name = email.split('@')[0].replace(/[._]/g, ' ');
  localStorage.setItem('gg_user', JSON.stringify({ email: email, name: name }));
 
  setTimeout(function () {
    window.location.href = 'dashboard.html';
  }, 900);
}
 
document.getElementById('password').addEventListener('keypress', function (e) {
  if (e.key === 'Enter') handleLogin();
});
 
document.getElementById('email').addEventListener('keypress', function (e) {
  if (e.key === 'Enter') document.getElementById('password').focus();
});
</script>
</body>
</html>
